<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stata Workflow Instructions</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    
    /* Animated background elements */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
                  radial-gradient(circle at 40% 80%, rgba(120, 119, 198, 0.08) 0%, transparent 50%);
      pointer-events: none;
      animation: float 20s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(1deg); }
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }
    
    .header {
      text-align: center;
      margin-bottom: 60px;
      transform: translateY(0);
      animation: slideInDown 0.8s ease-out;
    }
    
    @keyframes slideInDown {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .title {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    
    .subtitle {
      font-size: 1.1rem;
      color: #94a3b8;
      font-weight: 400;
    }
    
    .mode-toggle {
      display: flex;
      justify-content: center;
      margin-bottom: 50px;
      animation: slideInUp 0.8s ease-out 0.2s both;
    }
    
    @keyframes slideInUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .toggle-container {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    
    .toggle-btn {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    
    .toggle-btn.active {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
      transform: translateY(-2px);
    }
    
    .toggle-btn:hover:not(.active) {
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.05);
    }
    
    .content-wrapper {
      perspective: 1000px;
      animation: slideInUp 0.8s ease-out 0.4s both;
    }
    
    .workflow-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4),
                  0 10px 25px rgba(0, 0, 0, 0.2),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transform: rotateX(2deg);
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    
    .workflow-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.8), transparent);
    }
    
    .workflow-card:hover {
      transform: rotateX(0deg) translateY(-8px);
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.5),
                  0 15px 35px rgba(0, 0, 0, 0.3),
                  inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    
    .workflow-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .workflow-subtitle {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 32px;
      font-weight: 500;
    }
    
    .step-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .step-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    }
    
    .step-card:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(59, 130, 246, 0.3);
      transform: translateX(8px);
    }
    
    .step-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 50%;
      color: white;
      font-weight: 700;
      font-size: 0.85rem;
      margin-right: 12px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    
    .step-title {
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 12px;
      font-size: 1.1rem;
    }
    
    .step-content {
      color: #cbd5e1;
      line-height: 1.6;
    }
    
    .step-content ul {
      margin: 12px 0;
      padding-left: 20px;
    }
    
    .step-content li {
      margin-bottom: 8px;
      color: #94a3b8;
    }
    
    pre {
      background: rgba(0, 0, 0, 0.6);
      color: #e2e8f0;
      padding: 20px;
      border-radius: 12px;
      overflow-x: auto;
      margin: 16px 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    
    code {
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
      background: rgba(59, 130, 246, 0.1);
      color: #7dd3fc;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.9em;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }
    
    .highlight {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(29, 78, 216, 0.1));
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 16px;
      padding: 24px;
      margin: 32px 0;
      position: relative;
      overflow: hidden;
    }
    
    .highlight::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #3b82f6, transparent);
    }
    
    .highlight-text {
      color: #e2e8f0;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .icon {
      width: 20px;
      height: 20px;
      opacity: 0.8;
    }
    
    .fade-in {
      animation: fadeIn 0.6s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 20px 16px;
      }
      
      .title {
        font-size: 2rem;
      }
      
      .workflow-card {
        padding: 24px;
      }
      
      .step-card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">Stata Workflow</h1>
      <p class="subtitle">Streamlined analysis with automated organization</p>
    </div>
    
    <div class="mode-toggle">
      <div class="toggle-container">
        <button class="toggle-btn" onclick="toggleMode('local')">Local Setup</button>
        <button class="toggle-btn active" onclick="toggleMode('remote')">Remote GitHub</button>
      </div>
    </div>
    
    <div class="content-wrapper">
      <div class="workflow-card">
        <div id="content"></div>
      </div>
    </div>
  </div>

  <script>
    const remoteHTML = `
      <div class="fade-in">
        <h2 class="workflow-title">
          <svg class="icon" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M3 3a1 1 0 000 2v8a2 2 0 002 2h2.586l-1.293 1.293a1 1 0 101.414 1.414L10 15.414l2.293 2.293a1 1 0 001.414-1.414L12.414 15H15a2 2 0 002-2V5a1 1 0 100-2H3zm11.707 4.707a1 1 0 00-1.414-1.414L10 9.586 8.707 8.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
          </svg>
          Remote: Intermediate Stata Class
        </h2>
        <p class="workflow-subtitle">Workflow using GitHub-hosted script</p>
        
        <div class="step-card">
          <div class="step-title">
            <span class="step-number">1</span>
            Run directly from GitHub
          </div>
          <div class="step-content">
            If you have internet access in your session, fetch and run:
            <pre><code>do https://raw.githubusercontent.com/abikesa/stata-claude/refs/heads/main/scripts/just-click.do</code></pre>
          </div>
        </div>
        
        <div class="step-card">
          <div class="step-title">
            <span class="step-number">2</span>
            Script actions
          </div>
          <div class="step-content">
            The automated script will:
            <ul>
              <li>Organize files (data, scripts, output, docs)</li>
              <li>Run your Stata analysis</li>
              <li>Create <code>ukb-project.tar.gz</code> for easy sharing</li>
            </ul>
          </div>
        </div>
        
        <div class="highlight">
          <div class="highlight-text">
            <svg class="icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
            </svg>
            This version pulls everything remotely — no need to download manually.
          </div>
        </div>
      </div>
    `;

    const localHTML = `
      <div class="fade-in">
        <h2 class="workflow-title">
          <svg class="icon" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h4a1 1 0 010 2H6.414l4.293 4.293a1 1 0 01-1.414 1.414L5 6.414V8a1 1 0 01-2 0V4zm9 1a1 1 0 010-2h4a1 1 0 011 1v4a1 1 0 01-2 0V6.414l-4.293 4.293a1 1 0 11-1.414-1.414L13.586 5H12z" clip-rule="evenodd" />
          </svg>
          Local: Basic Stata Class
        </h2>
        <p class="workflow-subtitle">What you need to do:</p>
        
        <div class="step-card">
          <div class="step-title">
            <span class="step-number">1</span>
            Place the script
          </div>
          <div class="step-content">
            Put <code>just-click.do</code> in the same folder as your <code>.dta</code> files
          </div>
        </div>
        
        <div class="step-card">
          <div class="step-title">
            <span class="step-number">2</span>
            Run it
          </div>
          <div class="step-content">
            Open terminal in that folder and run:
            <pre><code>stata-mp -b do just-click.do</code></pre>
            <em style="color: #94a3b8;">(Or however you normally run Stata scripts)</em>
          </div>
        </div>
        
        <div class="step-card">
          <div class="step-title">
            <span class="step-number">3</span>
            Send back
          </div>
          <div class="step-content">
            The script creates <code>ukb-project.tar.gz</code> — just send that file
          </div>
        </div>
        
        <div class="step-card">
          <div class="step-title">
            <span class="step-number">4</span>
            What it does
          </div>
          <div class="step-content">
            <ul>
              <li>Organizes your files into clean folders</li>
              <li>Runs your analysis</li>
              <li>Packages everything</li>
            </ul>
          </div>
        </div>
        
        <div class="highlight">
          <div class="highlight-text">
            <svg class="icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
            </svg>
            This version assumes you're working locally with downloaded files.
          </div>
        </div>
      </div>
    `;

    let currentMode = 'remote';
    
    function toggleMode(mode) {
      currentMode = mode;
      
      // Update button states
      document.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      
      // Update content
      document.getElementById('content').innerHTML = mode === 'remote' ? remoteHTML : localHTML;
    }

    // Initialize with remote content
    document.getElementById('content').innerHTML = remoteHTML;
  </script>
</body>
</html>
